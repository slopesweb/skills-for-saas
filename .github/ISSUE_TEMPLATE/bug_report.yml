name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include paths, commands, and minimal files.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Repository version
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Tenant, security, or compatibility impact
